name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The "Run workflow" button: redeploys to refresh the copy of daily.txt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run waits instead of racing the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # CNB blocks cross-origin browser requests, so the site serves its own copy of the file.
      # curl -f fails the job on an HTTP error; grep fails it if CNB answers 200 with something that is not the rates.
      - name: Copy CNB daily.txt into the build
        run: |
          curl -fsS -o dist/daily.txt "https://www.cnb.cz/en/financial-markets/foreign-exchange-market/central-bank-exchange-rate-fixing/central-bank-exchange-rate-fixing/daily.txt"
          grep -q 'Country|Currency|Amount|Code|Rate' dist/daily.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
